<style>
/* Layout: 한 장짜리 단어장. 공책 줄처럼 단어가 한 줄씩 놓이고, 누른 단어에 형광펜이 그어진다. (보통 빠르기 하나만, 2026-10-29 선생님 결정). 같은 날 단어장이 여러 개면 제목별 구역으로 차례로 (2026-10-30). */
:root {
  --paper: #EEF2F8;      /* 책상 위 종이 바탕 */
  --sheet: #FFFFFF;      /* 단어장 한 장 */
  --ink: #15213B;        /* 남색 볼펜 */
  --ink-soft: #56637F;
  --rule: #DDE4EF;       /* 공책 줄 */
  --margin: #F0A9A4;     /* 공책 왼쪽 여백선 */
  --accent: #2A55D3;     /* 파란 펜 */
  --accent-ink: #FFFFFF;
  --marker: #FFE14D;     /* 형광펜 */
  --chip: #FFF4C2;
  --shadow: 0 1px 0 rgba(21,33,59,.04), 0 8px 24px -12px rgba(21,33,59,.18);
  --f-word: "Andika", "Comic Neue", system-ui, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #9CA8C2; --rule: #263049;
    --margin: #7A3F45; --accent: #8EAEFF; --accent-ink: #0E1422; --marker: rgba(255, 214, 64, .34);
    --chip: #3A3418; --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #9CA8C2; --rule: #263049;
  --margin: #7A3F45; --accent: #8EAEFF; --accent-ink: #0E1422; --marker: rgba(255, 214, 64, .34);
  --chip: #3A3418; --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-ko); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}

/* 머리말 */
header { display: grid; gap: 6px; padding-block: 8px 18px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-soft); letter-spacing: .02em; }
.chip { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.hint { margin: 0; color: var(--ink-soft); font-size: 14px; }
.hint b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.playall {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 14px/1 var(--f-ko); color: var(--accent);
  background: transparent; border: 1.5px solid var(--accent); border-radius: 999px;
  padding: 9px 14px; cursor: pointer;
}
.playall[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.playall svg { width: 14px; height: 14px; fill: currentColor; }

/* 같은 날 단어장이 여러 개일 때: 제목별 구역 */
.lists { display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.gtitle { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 18px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.gtitle .gn { flex: none; display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.gtitle .gc { flex: none; font-size: 13px; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* 단어장 */
.sheet {
  list-style: none; margin: 0; padding: 0;
  background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow);
  overflow: hidden;
}
.sheet li + li { border-top: 1px solid var(--rule); }
.row {
  width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center;
  gap: 0; min-height: 68px; padding: 10px 12px 10px 0;
  background: transparent; border: 0; text-align: left; color: inherit; cursor: pointer;
  font: inherit;
}
.row:active { background: color-mix(in srgb, var(--marker) 22%, transparent); }
.num {
  align-self: stretch; display: flex; align-items: center; justify-content: center;
  border-right: 1.5px solid var(--margin);
  font: 500 14px/1 var(--f-ko); color: var(--ink-soft); font-variant-numeric: tabular-nums;
}
.txt { min-width: 0; padding-left: 14px; display: grid; gap: 2px; }
.w {
  font-family: var(--f-word); font-weight: 700; font-size: 26px; line-height: 1.2;
  overflow-wrap: anywhere; justify-self: start;
  background-image: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
  background-repeat: no-repeat; background-size: 0% 100%;
  transition: background-size .35s ease-out;
  padding-inline: 2px; margin-inline: -2px;
}
.m { font-size: 16px; color: var(--ink-soft); overflow-wrap: anywhere; }
.row.playing .w, .row.done .w { background-size: 100% 100%; }
.row.done:not(.playing) .w { background-image: linear-gradient(transparent 58%, color-mix(in srgb, var(--marker) 45%, transparent) 58%, color-mix(in srgb, var(--marker) 45%, transparent) 92%, transparent 92%); }
.spk { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); }
.spk svg { width: 26px; height: 26px; }
.spk .wv { opacity: .35; }
.row.playing .spk .wv1 { animation: pulse .7s ease-in-out infinite; }
.row.playing .spk .wv2 { animation: pulse .7s ease-in-out .18s infinite; }
@keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row:focus-visible { outline-offset: -3px; }

footer { margin-top: 18px; color: var(--ink-soft); font-size: 13px; text-align: center; }

/* 지난 단어장 */
.past { margin-top: 28px; display: grid; gap: 10px; }
.past h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink-soft); letter-spacing: .02em; }
.past ol { list-style: none; margin: 0; padding: 0; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.past li + li { border-top: 1px solid var(--rule); }
.past a {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
  min-height: 56px; padding: 12px 16px; color: inherit; text-decoration: none;
}
.past a:active { background: color-mix(in srgb, var(--marker) 22%, transparent); }
.past .pt { font-weight: 700; overflow-wrap: anywhere; }
.past .pn { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.past .go, .home { color: var(--accent); }
.past .go { font-size: 20px; line-height: 1; }
.home {
  display: block; margin-top: 20px; padding: 14px 16px; text-align: center; font-weight: 700;
  border: 1.5px solid var(--accent); border-radius: 12px; text-decoration: none;
}
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.err { color: var(--ink); background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }

/* 누가 들었나요? (2026-11-13): 반에 학생 이름이 있으면 처음에 이름을 고르고, 끝까지 들은 단어에 ✓ */
.me { background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin: 0 0 18px; display: grid; gap: 10px; }
.me .mtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.me .nm { font-family: var(--f-word); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.me .swap { flex: none; border: 0; background: transparent; color: var(--accent); font: 700 14px/1 var(--f-ko); padding: 10px 4px; margin: -6px 0; cursor: pointer; }
.me .mbar { height: 10px; border-radius: 5px; background: var(--rule); overflow: hidden; }
.me .mbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 5px; transition: width .3s; }
.me .mtext { margin: 0; font-size: 14px; color: var(--ink-soft); word-break: keep-all; overflow-wrap: anywhere; }
.me .mtext b { color: var(--ink); font-variant-numeric: tabular-nums; }
.me.full { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
.me .doneline { margin: 0; font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; word-break: keep-all; }
.me .ck { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.num { flex-direction: column; }
.row.heard .num::after { content: "✓"; display: block; margin-top: 4px; font-size: 15px; font-weight: 700; color: var(--accent); }
.gtitle .gh { color: var(--accent); font-weight: 700; }
.dim { position: fixed; inset: 0; z-index: 20; background: rgba(21, 33, 59, .45); }
.pick { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow-y: auto; background: var(--sheet); color: var(--ink);
  border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -12px 40px -12px rgba(21, 33, 59, .35); }
.pick:focus { outline: none; }
.pick .pin { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pick h2 { margin: 0; font-size: 22px; }
.pick p { margin: 0; color: var(--ink-soft); font-size: 15px; word-break: keep-all; }
.pick .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap: 10px; margin-top: 4px; }
.pick .names button { min-height: 60px; padding: 8px 10px; border-radius: 14px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); font: 700 22px/1.2 var(--f-word); cursor: pointer; overflow-wrap: anywhere; }
.pick .names button:active { border-color: var(--accent); }
.pick .small { font-size: 13px; }
.pick .skip { justify-self: start; border: 0; background: transparent; color: var(--ink-soft); font: 500 14px/1 var(--f-ko); text-decoration: underline; padding: 10px 0; cursor: pointer; }
.pick button:focus-visible, .me button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .w { transition: none; }
  .row.playing .spk .wv1, .row.playing .spk .wv2 { animation: none; opacity: 1; }
}
@media (max-width: 360px) {
  .w { font-size: 23px; }
}

    try { player.currentTime = 0; } catch (e) {}
    const p = player.play();
    if (p && p.catch) p.catch(() => { mark(i, false); errBox.hidden = false; stopQueue(); });
  }

  player.addEventListener("ended", () => {
    heardWord(current);
    mark(current, false);
    if (queue !== null) {
      const next = current + 1;
      if (next >= rows.length) { stopQueue(); return; }
      const gap = 900;
      gapTimer = setTimeout(() => {
        if (queue === null) return;
        rows[next].scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        play(next);
      }, gap);
    }
  });
  player.addEventListener("error", () => { mark(current, false); errBox.hidden = false; stopQueue(); });

  function setPlayAllUI(on) {
    playAllBtn.setAttribute("aria-pressed", String(on));
    playAllLabel.textContent = on ? "멈추기" : "모두 듣기";
    playAllIcon.innerHTML = on ? ICON_STOP : ICON_PLAY;
  }
  function stopQueue() {
    if (queue === null) return;
    queue = null; clearTimeout(gapTimer); setPlayAllUI(false);
  }
  playAllBtn.addEventListener("click", () => {
    if (queue !== null) { stopQueue(); player.pause(); mark(current, false); return; }
    queue = true; setPlayAllUI(true);
    rows[0].scrollIntoView({ block: "nearest" });
    play(0);
  });
  // ---------- 누가 들었나요? (2026-11-13) ----------
  // 같은 폴더의 listen.json = { url: 선생님 구글 시트(Apps Script 웹 앱), classes: { 반코드: [영어 이름…] } }
  // 이 반에 이름이 있을 때만 켜진다. 끝까지 재생된 단어만 '들음'. 이름과 들은 번호는 이 휴대폰에 기억하고 구글 시트로 보낸다.
  const meEl = document.getElementById("me"), pickEl = document.getElementById("pick"), dimEl = document.getElementById("pickDim");
  const wrapEl = document.querySelector(".wrap");
  const code = V.cls_code || "";
  const fileName = decodeURIComponent(location.pathname.split("/").pop() || "");
  const datedFile = new RegExp("^" + code + "-\\d{4}-\\d{2}-\\d{2}(?:-\\d+)?\\.html$");
  const listIds = groups.map(g => g.href || (datedFile.test(fileName) ? fileName : (V.date ? code + "-" + V.date + ".html" : "")));
  const T = { on: false, url: "", names: [], name: null, heard: [], sent: [], dirty: [], busy: [], fail: [], timer: null, retry: null };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const kName = "dv-name:" + code;
  const kHeard = li => "dv-heard:" + code + ":" + T.name + ":" + listIds[li];
  const kSent = li => "dv-sent:" + code + ":" + T.name + ":" + listIds[li];
  const idsOf = s => String(s || "").split(",").filter(x => x.trim() !== "").map(Number).filter(n => Number.isInteger(n) && n >= 0);

  function loadMine() {
    T.heard = groups.map((g, li) => new Set(T.name ? idsOf(store.get(kHeard(li))).filter(n => n < g.words.length) : []));
    T.sent = groups.map((g, li) => (T.name ? +store.get(kSent(li)) || 0 : 0));
    T.dirty = groups.map((g, li) => T.heard[li].size > T.sent[li]);
    T.fail = groups.map(() => false);
  }

  function heardWord(i) {
    if (!T.on || !T.name || i < 0 || i >= rows.length) return;
    const li = rowList[i], set = T.heard[li];
    if (set.has(rowIdx[i])) return;
    set.add(rowIdx[i]);
    store.set(kHeard(li), [...set].join(","));
    T.dirty[li] = true;
    render();
    clearTimeout(T.timer);
    T.timer = setTimeout(flush, set.size >= groups[li].words.length ? 0 : 1500);
  }

  function params(li) {
    const g = groups[li];
    return { a: "log", cls: code, name: T.name, list: listIds[li], title: g.title || V.title || "", date: V.date || "", total: String(g.words.length), heard: [...T.heard[li]].sort((a, b) => a - b).join(",") };
  }
  function flush() {
    if (!T.on || !T.name) return;
    groups.forEach((g, li) => {
      if (!T.dirty[li] || T.busy[li] || !listIds[li] || !T.heard[li].size) return;
      T.dirty[li] = false; T.busy[li] = true;
      const p = params(li), n = T.heard[li].size, who = T.name;
      jsonp(T.url, p).then(r => {
        if (!r || !r.ok) throw new Error("not ok");
        if (who === T.name) { T.sent[li] = Math.max(T.sent[li], n); store.set(kSent(li), String(T.sent[li])); T.fail[li] = false; }
      }).catch(() => {
        if (who === T.name) { T.dirty[li] = true; T.fail[li] = true; }
        clearTimeout(T.retry); T.retry = setTimeout(flush, 30000);
      }).then(() => { T.busy[li] = false; if (T.dirty[li] && !T.fail[li]) flush(); render(); });
    });
    render();
  }
  // 페이지를 닫거나 다른 앱으로 갈 때 아직 못 보낸 기록을 한 번 더 보낸다
  function beacon() {
    if (!T.on || !T.name || !navigator.sendBeacon) return;
    groups.forEach((g, li) => { if (T.dirty[li] && T.heard[li].size) { try { navigator.sendBeacon(T.url, JSON.stringify(params(li))); } catch (e) {} } });
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") beacon(); });
  window.addEventListener("pagehide", beacon);
  window.addEventListener("online", flush);

  function jsonp(url, p, timeout) {
    return new Promise((resolve, reject) => {
      const cb = "__dv" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const s = document.createElement("script");
      let done = false;
      const fin = (err, d) => { if (done) return; done = true; clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); err ? reject(err) : resolve(d); };
      const t = setTimeout(() => fin(new Error("timeout")), timeout || 20000);
      window[cb] = d => fin(null, d);
      s.onerror = () => fin(new Error("network"));
      p = Object.assign({}, p, { cb: cb });
      s.src = url + "?" + Object.keys(p).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(p[k])).join("&");
      document.head.appendChild(s);
    });
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render() {
    if (!T.on) { meEl.hidden = true; return; }
    rows.forEach((r, i) => {
      const h = !!(T.name && T.heard[rowList[i]] && T.heard[rowList[i]].has(rowIdx[i]));
      r.classList.toggle("heard", h);
      r.setAttribute("aria-label", labels[i] + (h ? ", 들음" : ""));
    });
    if (multi) groups.forEach((g, li) => {
      const gc = gcEls[li]; if (!gc) return;
      const n = T.name ? T.heard[li].size : 0, tot = g.words.length;
      gc.textContent = "단어 " + tot + "개";
      if (n) { const s = el("span", "gh", n >= tot ? " · ✓ 다 들음" : " · " + n + "개 들음"); gc.appendChild(s); }
    });
    meEl.hidden = false;
    meEl.textContent = "";
    meEl.classList.remove("full");
    if (!T.name) {
      const top = el("div", "mtop");
      top.appendChild(el("p", "mtext", "이름을 고르면 들은 단어가 선생님께 전해져요."));
      const b = el("button", "swap", "이름 고르기"); b.type = "button"; b.addEventListener("click", openPick);
      top.appendChild(b); meEl.appendChild(top);
      return;
    }
    const tot = groups.reduce((k, g) => k + g.words.length, 0);
    const n = T.heard.reduce((k, s) => k + s.size, 0);
    const allSent = groups.every((g, li) => T.sent[li] >= g.words.length);
    const failed = T.fail.some(Boolean);
    const top = el("div", "mtop");
    top.appendChild(el("span", "nm", T.name));
    const b = el("button", "swap", "이름 바꾸기"); b.type = "button"; b.addEventListener("click", openPick);
    top.appendChild(b); meEl.appendChild(top);
    const bar = el("div", "mbar"); const fill = el("i"); fill.style.width = (tot ? Math.round(n / tot * 100) : 0) + "%"; bar.appendChild(fill);
    bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-label", "들은 단어"); bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", String(tot)); bar.setAttribute("aria-valuenow", String(n));
    meEl.appendChild(bar);
    if (tot && n >= tot) {
      meEl.classList.add("full");
      const d = el("p", "doneline"); d.appendChild(el("span", "ck", "✓"));
      d.appendChild(document.createTextNode(n + "개 다 들었어요! " + (allSent ? "선생님께 전해졌어요." : failed ? "아직 선생님께 못 보냈어요. 인터넷이 연결되면 다시 보낼게요." : "선생님께 보내는 중이에요…")));
      d.querySelector(".ck").setAttribute("aria-hidden", "true");
      meEl.appendChild(d);
    } else {
      const p = el("p", "mtext"); p.appendChild(document.createTextNode("들은 단어 ")); p.appendChild(el("b", "", String(n)));
      p.appendChild(document.createTextNode(" / " + tot + (failed ? " · 기록을 아직 못 보냈어요. 인터넷이 연결되면 다시 보낼게요." : " · 끝까지 들은 단어에 ✓ 표시가 생겨요")));
      meEl.appendChild(p);
    }
  }

  let lastFocus = null;
  function openPick() {
    stopQueue(); player.pause(); if (current >= 0) mark(current, false);
    const box = document.getElementById("pickNames"); box.textContent = "";
    T.names.forEach(nm => {
      const b = el("button", "", nm); b.type = "button"; b.setAttribute("lang", "en");
      b.addEventListener("click", () => choose(nm));
      box.appendChild(b);
    });
    lastFocus = document.activeElement;
    pickEl.hidden = false; dimEl.hidden = false; wrapEl.inert = true; wrapEl.setAttribute("aria-hidden", "true");
    pickEl.focus();  // 첫 이름에 테두리가 생기면 이미 골라진 것처럼 보여서, 창 자체에 둔다 (Tab 으로 이름으로 이동)
  }
  function closePick() {
    pickEl.hidden = true; dimEl.hidden = true; wrapEl.inert = false; wrapEl.removeAttribute("aria-hidden");
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }
  function choose(nm) {
    beacon();
    T.name = nm; store.set(kName, nm);
    loadMine(); closePick(); render(); flush();
  }
  document.getElementById("pickSkip").addEventListener("click", () => { T.name = null; loadMine(); closePick(); render(); });
  pickEl.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("pickSkip").click(); });

  if (/^https?:$/.test(location.protocol) && code && allWords.length) {
    fetch("listen.json?t=" + Math.floor(Date.now() / 300000), { cache: "no-store" })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        const names = j && j.classes && Array.isArray(j.classes[code]) ? j.classes[code].filter(x => typeof x === "string" && x) : [];
        const url = j && typeof j.url === "string" ? j.url : "";
        if (!names.length || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) return;
        T.on = true; T.url = url; T.names = names;
        const saved = store.get(kName);
        T.name = names.indexOf(saved) >= 0 ? saved : null;
        loadMine(); render();
        if (T.name) flush(); else openPick();
      })
      .catch(() => {});
  }
})();
</script>
</body>
</html>
