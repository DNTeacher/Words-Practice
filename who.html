<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>들어Voca</title>
<!-- 휴대폰용 '누가 들었나요?' (2026-11-16): 아이폰 홈 화면에 '들어Voca'로 추가해서 쓰는 페이지 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="들어Voca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1422" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="app/icons/who-180.png?v=27">
<link rel="icon" type="image/png" href="app/icons/who-192.png?v=27">
<link rel="manifest" href="who.webmanifest?v=27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 선생님 앱과 같은 종이·남색 잉크 색. 휴대폰 한 손으로 보기: 학생마다 한 줄, 글씨 크게 */
:root {
  --paper: #EEF2F8; --sheet: #FFFFFF; --ink: #15213B; --ink-soft: #4A5672; --rule: #DDE4EF; --line: #C3CEDF;
  --accent: #2A55D3; --accent-ink: #FFFFFF;
  --ok: #1F7A4D; --ok-bg: #E3F4EA; --warn: #9A5B00; --warn-bg: #FFF1D6; --bad: #B3261E; --bad-bg: #FCE8E6;
  --f-word: "Andika", system-ui, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #A9B4CC; --rule: #263049; --line: #3A4766;
    --accent: #8EAEFF; --accent-ink: #0E1422;
    --ok: #7BD3A3; --ok-bg: #173527; --warn: #F2C26B; --warn-bg: #3A2E14; --bad: #FF9C94; --bad-bg: #3D1C1A; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-ko); }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 14px; }
.top h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
.top h1 i { font-style: normal; color: var(--accent); }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--sheet); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); padding: 8px 14px; font-size: 15px; }
.link { border: 0; background: none; padding: 6px 0; color: var(--ink-soft); font-size: 14px; cursor: pointer; }

/* 열쇠 넣기 */
.key { background: var(--sheet); border-radius: 16px; padding: 20px 18px; display: grid; gap: 12px; }
.key h2 { margin: 0; font-size: 19px; }
.key p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.key input { border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 13px 14px; font-size: 16px; width: 100%; }
.key ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink-soft); }
.knote { margin: 0; border-radius: 10px; padding: 10px 12px; background: var(--bad-bg); color: var(--bad); font-size: 14px; font-weight: 500; }

/* 기록 */
.pick { display: block; margin-bottom: 12px; }
.pick select { width: 100%; appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 12px 40px 12px 14px; font-size: 17px; font-weight: 700;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
  background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%; background-size: 6px 6px; background-repeat: no-repeat; }
.msg { margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; background: var(--sheet); color: var(--ink-soft); font-size: 15px; }
.msg.bad { background: var(--bad-bg); color: var(--bad); font-weight: 500; }
.latest { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--sheet); box-shadow: inset 4px 0 0 var(--accent); margin-bottom: 10px; }
.latest b { font-size: 18px; overflow-wrap: anywhere; }
.latest span { font-size: 14px; color: var(--ink-soft); }
.sum { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.sum:empty { display: none; }
.st { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.st.ok { background: var(--ok-bg); color: var(--ok); }
.st.part { background: var(--warn-bg); color: var(--warn); }
.st.none { background: var(--bad-bg); color: var(--bad); }
.st.pre { background: var(--paper); color: var(--ink-soft); font-weight: 500; }
.list { list-style: none; margin: 0; padding: 0; background: var(--sheet); border-radius: 14px; overflow: hidden; }
.r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--rule); }
.r:first-child { border-top: 0; }
.r .n span { display: block; font: 700 18px/1.3 var(--f-word); overflow-wrap: anywhere; }
.r .n small { display: block; font-size: 12.5px; color: var(--ink-soft); }
.r .s { display: grid; justify-items: end; gap: 2px; }
.r .t { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r2 .s { gap: 6px; }
.r2 .line { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; font-size: 13px; }
.r2 .line b { font-weight: 500; overflow-wrap: anywhere; }
.r2 .line .t { flex-basis: 100%; text-align: right; margin-top: -4px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; font-size: 15px; }
.foot a { color: var(--accent); font-weight: 700; text-decoration: none; }
.upd { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><i>✓</i> 누가 들었나요?</h1>
    <button class="btn ghost" id="refresh" type="button" hidden>↻ 새로고침</button>
  </header>

  <section class="key" id="keyView" hidden aria-labelledby="kh">
    <h2 id="kh">GitHub 열쇠를 넣어 주세요</h2>
    <p>컴퓨터 선생님 앱에 넣은 것과 같은 열쇠예요. 이 휴대폰에서 처음 한 번만 넣으면 돼요.</p>
    <input id="keyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="GitHub 열쇠">
    <p class="knote" id="keyNote" role="alert" hidden></p>
    <button class="btn" id="keySave" type="button">저장하고 보기</button>
    <ol>
      <li>열쇠는 이 휴대폰에만 저장돼요.</li>
      <li>열쇠를 적어 둔 게 없으면 컴퓨터 선생님 앱 → 설정에서 새로 만들 수 있어요.</li>
    </ol>
  </section>

  <main id="mainView" hidden>
    <label class="pick"><span hidden>반</span><select id="cls" aria-label="반"></select></label>
    <p class="msg" id="msg" role="status" hidden></p>
    <div class="latest" id="latest" hidden></div>
    <div class="sum" id="sum"></div>
    <ul class="list" id="list" hidden></ul>
    <div class="foot">
      <a id="sheet" href="#" target="_blank" rel="noopener" hidden>구글 시트 열기 ↗</a>
      <span></span>
      <button class="link" id="changeKey" type="button">열쇠 바꾸기</button>
    </div>
    <p class="upd" id="upd"></p>
  </main>
</div>
<script type="module" src="app/who.js?v=27"></script>
</body>
</html>
