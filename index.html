<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>영어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #EEF2F8; --sheet: #FFFFFF; --ink: #15213B; --ink-soft: #56637F; --rule: #DDE4EF;
  --margin: #F0A9A4; --accent: #2A55D3; --chip: #FFF4C2; --marker: #FFE14D;
  --shadow: 0 1px 0 rgba(21,33,59,.04), 0 8px 24px -12px rgba(21,33,59,.18);
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #9CA8C2; --rule: #263049;
    --margin: #7A3F45; --accent: #8EAEFF; --chip: #3A3418; --marker: rgba(255,214,64,.34);
    --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-ko); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 40px; }
h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.25; }
.hint { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
ol { list-style: none; margin: 0; padding: 0; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
li + li { border-top: 1px solid var(--rule); }
a { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px;
  padding: 16px 16px 16px 18px; color: inherit; text-decoration: none; min-height: 64px; }
a:active { background: color-mix(in srgb, var(--marker) 22%, transparent); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.t { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.n { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.new { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
.go { color: var(--accent); font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>영어 단어장</h1>
  <p class="hint">날짜를 누르면 그날 외울 단어와 발음이 나와요.</p>
  <ol>
    <li><a href="2026-10-29.html"><span><span class="t">10월 29일 영어 단어</span><span class="new">최신</span><br><span class="n">단어 16개 · 예시</span></span><span class="go" aria-hidden="true">›</span></a></li>
  </ol>
</div>
</body>
</html>
