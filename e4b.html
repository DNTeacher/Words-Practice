<style>
/* Layout: 한 장짜리 단어장. 공책 줄처럼 단어가 한 줄씩 놓이고, 누른 단어에 형광펜이 그어진다. (보통 빠르기 하나만, 2026-10-29 선생님 결정). 같은 날 단어장이 여러 개면 제목별 구역으로 차례로 (2026-10-30). */
:root {
  --paper: #EEF2F8;      /* 책상 위 종이 바탕 */
  --sheet: #FFFFFF;      /* 단어장 한 장 */
  --ink: #15213B;        /* 남색 볼펜 */
  --ink-soft: #56637F;
  --rule: #DDE4EF;       /* 공책 줄 */
  --margin: #F0A9A4;     /* 공책 왼쪽 여백선 */
  --accent: #2A55D3;     /* 파란 펜 */
  --accent-ink: #FFFFFF;
  --marker: #FFE14D;     /* 형광펜 */
  --chip: #FFF4C2;
  --shadow: 0 1px 0 rgba(21,33,59,.04), 0 8px 24px -12px rgba(21,33,59,.18);
  --f-word: "Andika", "Comic Neue", system-ui, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #9CA8C2; --rule: #263049;
    --margin: #7A3F45; --accent: #8EAEFF; --accent-ink: #0E1422; --marker: rgba(255, 214, 64, .34);
    --chip: #3A3418; --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1422; --sheet: #161E30; --ink: #EDF1F9; --ink-soft: #9CA8C2; --rule: #263049;
  --margin: #7A3F45; --accent: #8EAEFF; --accent-ink: #0E1422; --marker: rgba(255, 214, 64, .34);
  --chip: #3A3418; --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-ko); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}

/* 머리말 */
header { display: grid; gap: 6px; padding-block: 8px 18px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-soft); letter-spacing: .02em; }
.chip { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.hint { margin: 0; color: var(--ink-soft); font-size: 14px; }
.hint b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.playall {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 14px/1 var(--f-ko); color: var(--accent);
  background: transparent; border: 1.5px solid var(--accent); border-radius: 999px;
  padding: 9px 14px; cursor: pointer;
}
.playall[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.playall svg { width: 14px; height: 14px; fill: currentColor; }

/* 같은 날 단어장이 여러 개일 때: 제목별 구역 */
.lists { display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.gtitle { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 18px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.gtitle .gn { flex: none; display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.gtitle .gc { flex: none; font-size: 13px; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* 단어장 */
.sheet {
  list-style: none; margin: 0; padding: 0;
  background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow);
  overflow: hidden;
}
.sheet li + li { border-top: 1px solid var(--rule); }
.row {
  width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center;
  gap: 0; min-height: 68px; padding: 10px 12px 10px 0;
  background: transparent; border: 0; text-align: left; color: inherit; cursor: pointer;
  font: inherit;
}
.row:active { background: color-mix(in srgb, var(--marker) 22%, transparent); }
.num {
  align-self: stretch; display: flex; align-items: center; justify-content: center;
  border-right: 1.5px solid var(--margin);
  font: 500 14px/1 var(--f-ko); color: var(--ink-soft); font-variant-numeric: tabular-nums;
}
.txt { min-width: 0; padding-left: 14px; display: grid; gap: 2px; }
.w {
  font-family: var(--f-word); font-weight: 700; font-size: 26px; line-height: 1.2;
  overflow-wrap: anywhere; justify-self: start;
  background-image: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
  background-repeat: no-repeat; background-size: 0% 100%;
  transition: background-size .35s ease-out;
  padding-inline: 2px; margin-inline: -2px;
}
.m { font-size: 16px; color: var(--ink-soft); overflow-wrap: anywhere; }
.row.playing .w, .row.done .w { background-size: 100% 100%; }
.row.done:not(.playing) .w { background-image: linear-gradient(transparent 58%, color-mix(in srgb, var(--marker) 45%, transparent) 58%, color-mix(in srgb, var(--marker) 45%, transparent) 92%, transparent 92%); }
.spk { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); }
.spk svg { width: 26px; height: 26px; }
.spk .wv { opacity: .35; }
.row.playing .spk .wv1 { animation: pulse .7s ease-in-out infinite; }
.row.playing .spk .wv2 { animation: pulse .7s ease-in-out .18s infinite; }
@keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row:focus-visible { outline-offset: -3px; }

footer { margin-top: 18px; color: var(--ink-soft); font-size: 13px; text-align: center; }

/* 지난 단어장 */
.past { margin-top: 28px; display: grid; gap: 10px; }
.past h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink-soft); letter-spacing: .02em; }
.past ol { list-style: none; margin: 0; padding: 0; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.past li + li { border-top: 1px solid var(--rule); }
.past a {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
  min-height: 56px; padding: 12px 16px; color: inherit; text-decoration: none;
}
.past a:active { background: color-mix(in srgb, var(--marker) 22%, transparent); }
.past .pt { font-weight: 700; overflow-wrap: anywhere; }
.past .pn { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.past .go, .home { color: var(--accent); }
.past .go { font-size: 20px; line-height: 1; }
.home {
  display: block; margin-top: 20px; padding: 14px 16px; text-align: center; font-weight: 700;
  border: 1.5px solid var(--accent); border-radius: 12px; text-decoration: none;
}
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.err { color: var(--ink); background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  .w { transition: none; }
  .row.playing .spk .wv1, .row.playing .spk .wv2 { animation: none; opacity: 1; }
}
@media (max-width: 360px) {
  .w { font-size: 23px; }
}
</style>

(function () {
  // 예약해 둔 단어장 (2026-11-03): DATA.next = { at: 보이기 시작하는 때, data: 그때의 반 페이지 }. 이 기기 시계로 지금 보일 것을 고른다.
  let V = DATA;
  while (V && V.next && V.next.at && Date.now() >= Date.parse(V.next.at)) V = V.next.data;
  if (V && V.next && V.next.at) {
    // 페이지를 열어 둔 채로 그 시각이 되면 새로고침해서 새 단어장을 보여 준다
    const ms = Date.parse(V.next.at) - Date.now() + 1500;
    if (ms > 0 && ms < 2147483647) setTimeout(() => location.reload(), ms);
  }
  const listsEl = document.getElementById("lists");
  const playAllBtn = document.getElementById("playAll");
  const playAllLabel = document.getElementById("playAllLabel");
  const playAllIcon = document.getElementById("playAllIcon");
  const errBox = document.getElementById("err");
  const ICON_PLAY = '<path d="M4 2.5v11l9-5.5z"/>';
  const ICON_STOP = '<rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/>';

  // 같은 날 단어장이 여러 개면 V.sets 에 제목별로 들어 있다 (반 주소). 하나면 V.words.
  const groups = Array.isArray(V.sets) && V.sets.length ? V.sets : [{ title: V.title, words: V.words || [] }];
  const multi = groups.length > 1;
  const allWords = groups.flatMap(g => g.words);
  document.getElementById("title").textContent = allWords.length ? (V.title || "영어 단어") : "아직 올라온 단어장이 없어요";
  document.getElementById("count").textContent = allWords.length;
  if (multi) document.getElementById("hint").insertBefore(document.createTextNode("단어장 " + groups.length + "개 · "), document.getElementById("hint").firstChild);
  document.getElementById("sampleChip").hidden = !V.sample;
  if (!allWords.length) {
    document.getElementById("hint").textContent = "선생님이 단어장을 올리면 이 주소에서 바로 볼 수 있어요.";
    playAllBtn.hidden = true;
  }
  if (V.cls) document.getElementById("cls").textContent = "들어Voca · " + V.cls;

  // 반 주소에서 열었을 때: 아래에 지난 단어장 목록
  if (Array.isArray(V.past) && V.past.length) {
    const ol = document.getElementById("pastList");
    V.past.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = p.href;
      a.innerHTML = '<span class="pt"></span><span class="pn"></span><span class="go" aria-hidden="true">›</span>';
      a.querySelector(".pt").textContent = p.title;
      const dm = /(\d{4})-(\d{2})-(\d{2})/.exec(p.date || p.href || "");
      a.querySelector(".pn").textContent = (dm ? (+dm[2]) + "월 " + (+dm[3]) + "일 · " : "") + "단어 " + p.n + "개";
      li.appendChild(a); ol.appendChild(li);
    });
    document.getElementById("past").hidden = false;
  }
  // 날짜별 주소에서 열었을 때: 반 최신 단어장으로 가는 링크
  if (V.home) {
    const h = document.getElementById("home");
    h.href = V.home;
    h.textContent = (V.cls ? V.cls + " " : "") + "최신 단어장 보기 ›";
    h.hidden = false;
  }

  // 음성: 단어마다 보통 빠르기 mp3 가 들어 있다 (예전 단어장에는 느린 음성도 있지만 쓰지 않음). 처음 누를 때 재생용 주소로 바꾼다.
  const urls = {};
  function urlFor(i, key = "normal") {
    const id = i + ":" + key;
    if (urls[id]) return urls[id];
    const b64 = allWords[i].a[key];
    let u;
    try {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      u = URL.createObjectURL(new Blob([arr], { type: "audio/mpeg" }));
    } catch (e) { u = "data:audio/mpeg;base64," + b64; }
    return (urls[id] = u);
  }

  // 오디오 요소 하나를 계속 다시 쓴다 (아이폰 무음 모드·연속 재생에서 가장 안정적)
  const player = new Audio();
  player.preload = "auto";
  let current = -1, queue = null, gapTimer = null;

  const rows = [];
  groups.forEach((g, gi) => {
    const ol = document.createElement("ol");
    ol.className = "sheet";
    if (multi) {
      const sec = document.createElement("section");
      sec.className = "group";
      const h2 = document.createElement("h2");
      h2.className = "gtitle";
      h2.innerHTML = '<span class="gn"></span><span class="gt"></span><span class="gc"></span>';
      h2.querySelector(".gn").textContent = gi + 1;
      h2.querySelector(".gt").textContent = g.title || "단어장";
      h2.querySelector(".gc").textContent = "단어 " + g.words.length + "개";
      sec.appendChild(h2); sec.appendChild(ol); listsEl.appendChild(sec);
    } else listsEl.appendChild(ol);
    g.words.forEach((w, wi) => {
      const i = rows.length;
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "row"; btn.id = "word-" + (i + 1);
      btn.setAttribute("aria-label", w.w + ", " + w.m + ", 발음 듣기");
      btn.innerHTML =
        '<span class="num" aria-hidden="true"></span>' +
        '<span class="txt"><span class="w" lang="en"></span><span class="m"></span></span>' +
        '<span class="spk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none"/>' +
        '<path class="wv wv1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="wv wv2" d="M18.3 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>';
      btn.querySelector(".num").textContent = wi + 1;
      btn.querySelector(".w").textContent = w.w;
      btn.querySelector(".m").textContent = w.m;
      btn.addEventListener("click", () => { stopQueue(); play(i); });
      li.appendChild(btn); ol.appendChild(li);
      rows.push(btn);
    });
  });

  function mark(i, on) { if (rows[i]) { rows[i].classList.toggle("playing", on); if (on) rows[i].classList.add("done"); } }

  function play(i) {
    clearTimeout(gapTimer);
    if (current >= 0) mark(current, false);
    current = i; mark(i, true); errBox.hidden = true;
    player.src = urlFor(i);
    try { player.currentTime = 0; } catch (e) {}
    const p = player.play();
    if (p && p.catch) p.catch(() => { mark(i, false); errBox.hidden = false; stopQueue(); });
  }

  player.addEventListener("ended", () => {
    mark(current, false);
    if (queue !== null) {
      const next = current + 1;
      if (next >= rows.length) { stopQueue(); return; }
      const gap = 900;
      gapTimer = setTimeout(() => {
        if (queue === null) return;
        rows[next].scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        play(next);
      }, gap);
    }
  });
  player.addEventListener("error", () => { mark(current, false); errBox.hidden = false; stopQueue(); });

  function setPlayAllUI(on) {
    playAllBtn.setAttribute("aria-pressed", String(on));
    playAllLabel.textContent = on ? "멈추기" : "모두 듣기";
    playAllIcon.innerHTML = on ? ICON_STOP : ICON_PLAY;
  }
  function stopQueue() {
    if (queue === null) return;
    queue = null; clearTimeout(gapTimer); setPlayAllUI(false);
  }
  playAllBtn.addEventListener("click", () => {
    if (queue !== null) { stopQueue(); player.pause(); mark(current, false); return; }
    queue = true; setPlayAllUI(true);
    rows[0].scrollIntoView({ block: "nearest" });
    play(0);
  });
})();
